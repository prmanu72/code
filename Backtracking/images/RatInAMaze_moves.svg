<svg xmlns="http://www.w3.org/2000/svg" width="520" height="230" viewBox="0 0 520 230">
  <defs>
    <style>
      .title { font: 700 20px Arial, sans-serif; fill: #1f2937; }
      .cell { fill: #f8fafc; stroke: #475569; stroke-width: 2; }
      .center { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .dir { font: 700 18px Arial, sans-serif; fill: #2563eb; }
      .small { font: 600 13px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="24" y="32" class="title">Move order for lexicographical output</text>

  <rect x="210" y="90" width="90" height="50" class="cell"/>
  <text x="238" y="121" class="center">current</text>

  <rect x="210" y="20" width="90" height="50" class="cell"/>
  <text x="245" y="51" class="dir">U</text>

  <rect x="210" y="160" width="90" height="50" class="cell"/>
  <text x="245" y="191" class="dir">D</text>

  <rect x="90" y="90" width="90" height="50" class="cell"/>
  <text x="128" y="121" class="dir">L</text>

  <rect x="330" y="90" width="90" height="50" class="cell"/>
  <text x="368" y="121" class="dir">R</text>

  <path d="M255 90 L255 70" class="arrow"/>
  <path d="M255 140 L255 160" class="arrow"/>
  <path d="M210 115 L180 115" class="arrow"/>
  <path d="M300 115 L330 115" class="arrow"/>

  <text x="24" y="170" class="small">To generate paths in sorted order, explore directions as:</text>
  <text x="24" y="192" class="small">D, L, R, U because D &lt; L &lt; R &lt; U lexicographically.</text>
  <text x="24" y="214" class="small">That makes the recursion produce sorted path strings without a separate sort step.</text>
</svg>
